services:
  - type: web
    name: backend
    region: singapore
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: FLASK_APP
        value: director.entrypoint.api.server
      - key: SERVER_ENV
        value: production
      # URL of the deployed frontend, e.g. https://your-frontend.onrender.com
      - key: SERVER_ALLOWED_ORIGINS
        sync: false
    
  - type: web
    name: frontend
    region: singapore
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
